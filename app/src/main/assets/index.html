<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#123d63"><title>مصنعي البسيط</title><style>
:root{font-family:system-ui,'Noto Sans Arabic',sans-serif;color:#162d42;background:#f2f5f8}*{box-sizing:border-box}body{margin:0}header{background:#123d63;color:white;padding:18px 16px;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}header small{display:block;opacity:.8}main{max-width:720px;margin:auto;padding:14px 12px 80px}.card{background:white;border-radius:15px;padding:16px;margin:0 0 12px;box-shadow:0 2px 9px #142d4410}.title{font-weight:800;font-size:19px;margin:0 0 12px}.muted{color:#667b8b;font-size:13px}.btn{border:0;background:#1765a1;color:white;padding:13px 14px;border-radius:11px;font:inherit;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#e9f1f7;color:#174365}.btn.danger{background:#b63f3f}.btn.good{background:#17815b}.btn.full{width:100%}.btn.small{padding:8px 10px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.flex{display:flex;align-items:center;justify-content:space-between;gap:8px}.stack{display:grid;gap:9px}label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #ccd9e3;background:#fff;border-radius:10px;padding:12px;font:inherit;color:#182e41;min-width:0}input[type=number]{direction:ltr;text-align:right}nav{display:flex;gap:6px;overflow:auto;padding:8px 0 12px}nav button{flex:none}.chip{background:#edf4f8;padding:5px 9px;border-radius:30px;font-size:12px}.row{border-bottom:1px solid #edf1f4;padding:11px 0}.row:last-child{border-bottom:0}.metric{background:#edf5fb;padding:12px;border-radius:12px}.metric b{font-size:22px;display:block}.hidden{display:none!important}.entry{border:1px solid #dae4eb;border-radius:12px;padding:11px;margin:10px 0}.notice{background:#fff3d9;padding:11px;border-radius:10px;color:#7c5400}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{font-size:13px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9fd1fc} .bad{color:#ba3535}.ok{color:#148257} .line{padding:11px;border-radius:10px;background:#f4f8fb;margin-bottom:8px} .smalltext{font-size:12px} @media(max-width:370px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><strong>مصنعي</strong><small>MARBLE DESIGN · إنتاج وجودة</small></div><span id="shiftBadge" class="chip">لا توجد وردية</span></header><main><nav id="nav"></nav><section id="app"></section></main><script>
'use strict';const KEY='masnayi_simple_v1';const LINES=[{id:'m2',name:'رخام 2 — MDB',kind:'marble',prefix:'MDB',min:14,max:16,sec:150},{id:'m3',name:'رخام 3 — MD',kind:'marble',prefix:'MD',min:10.7,max:12,sec:100},{id:'w2',name:'خشب 2 — 16',kind:'wood',factor:8,sec:85},{id:'w4',name:'خشب 4 — 16',kind:'wood',factor:8,sec:85},{id:'w5',name:'خشب 5 — 20',kind:'wood',factor:6,sec:90},{id:'w6',name:'خشب 6 — 20',kind:'wood',factor:6,sec:90}];const WASTE=[{id:'m2',name:'هالك رخام 2'},{id:'m3',name:'هالك رخام 3'},{id:'wood',name:'هالك الخشب المشترك'}];let db=load(),page='home',selectedShift=null;function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.shifts))return x}catch(e){}return{shifts:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(x){return Number(x)||0}function fmt(x){return Number(x||0).toLocaleString('en-US',{maximumFractionDigits:2})}function stamp(){return new Date().toISOString()}function dateText(x){return new Date(x).toLocaleString('ar-EG')}function current(){return db.shifts.find(s=>s.id===selectedShift)||db.shifts.find(s=>!s.closed)||null}function line(id){return LINES.find(l=>l.id===id)}function net(r,tare){return n(r.weight)-(r.mode==='gross'?tare:0)}function qty(r){let l=line(r.line);return l?.kind==='wood'?(r.unit==='columns'?n(r.count)*l.factor:n(r.count)):n(r.count)}function allProd(s,id){return s.prod.filter(r=>!id||r.line===id)}function sumProd(s,id){return allProd(s,id).reduce((a,r)=>a+net(r,40),0)}function sumQty(s,id){return allProd(s,id).reduce((a,r)=>a+qty(r),0)}function sumWaste(s,id){return s.waste.filter(r=>!id||r.group===id).reduce((a,r)=>a+net(r,20),0)}function safeSet(){try{save();return true}catch(e){alert('تعذر الحفظ: مساحة الجهاز ممتلئة أو التخزين غير متاح');return false}}function go(p,id){page=p;if(id)selectedShift=id;render();window.scrollTo(0,0)}function editShift(){let s=current();if(s&&s.closed){s.closed=null;safeSet()}}function nav(){let items=[['home','الرئيسية'],['production','الإنتاج'],['waste','الهالك'],['issues','المشاكل'],['reports','السجلات']];document.getElementById('nav').innerHTML=items.map(([p,t])=>`<button class="btn small ${page===p?'':'secondary'}" onclick="go('${p}')">${t}</button>`).join('');let s=current();document.getElementById('shiftBadge').textContent=s?(s.closed?'وردية مغلقة':'وردية مفتوحة'):'لا توجد وردية'}function selectLines(kind){return LINES.filter(l=>l.kind===kind).map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}function shiftIntro(s){return `<div class="card"><div class="flex"><b>${esc(s.label)} · ${esc(s.date)}</b><span class="chip">${s.closed?'مغلقة':'مفتوحة'}</span></div><div class="muted">المسؤول: ${esc(s.supervisor||'غير محدد')} · بدأت ${dateText(s.created)}</div></div>`}function home(){let s=current();return `${s?shiftIntro(s):''}${!s?`<div class="card"><h2 class="title">فتح وردية جديدة</h2><form onsubmit="createShift(event)" class="stack"><div class="grid"><div><label>التاريخ</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div><label>الوردية</label><select name="label"><option>صباحي 8–8</option><option>مسائي 8–8</option></select></div></div><div><label>مسؤول التشغيل (اختياري)</label><input name="supervisor" placeholder="الاسم"></div><button class="btn good full">فتح الوردية</button></form></div>`:`<div class="card"><h2 class="title">ملخص الوردية</h2><div class="grid"><div class="metric"><span class="muted">ألواح الرخام</span><b>${fmt(sumQty(s,'m2')+sumQty(s,'m3'))}</b></div><div class="metric"><span class="muted">ألواح الخشب</span><b>${fmt(LINES.filter(l=>l.kind==='wood').reduce((a,l)=>a+sumQty(s,l.id),0))}</b></div><div class="metric"><span class="muted">وزن الإنتاج الصافي</span><b>${fmt(sumProd(s))} <small>كجم</small></b></div><div class="metric"><span class="muted">صافي الهالك</span><b>${fmt(sumWaste(s))} <small>كجم</small></b></div></div></div><div class="card"><div class="grid"><button class="btn" onclick="go('production')">+ تسجيل إنتاج</button><button class="btn" onclick="go('waste')">+ تسجيل هالك</button><button class="btn secondary" onclick="go('issues')">⚠ مشكلة خط</button><button class="btn secondary" onclick="go('reports')">السجلات والتقارير</button></div></div><div class="card">${s.closed?`<button class="btn good full" onclick="reopen()">فتح الوردية للتعديل</button>`:`<button class="btn danger full" onclick="closeShift()">إغلاق الوردية وإصدار التقرير</button>`}</div>`}<div class="card"><h2 class="title">الورديات السابقة</h2>${db.shifts.length?db.shifts.slice().reverse().map(x=>`<div class="row flex"><div><b>${esc(x.date)} · ${esc(x.label)}</b><div class="muted">${x.closed?'مغلقة':'مفتوحة'} · ${x.prod.length} تسجيل إنتاج</div></div><button class="btn small secondary" onclick="go('home','${x.id}')">فتح</button></div>`).join(''):'<p class="muted">لا توجد ورديات محفوظة بعد.</p>'}</div>`}function createShift(e){e.preventDefault();let f=new FormData(e.target);let s={id:uid(),date:f.get('date'),label:f.get('label'),supervisor:f.get('supervisor'),created:stamp(),closed:null,prod:[],waste:[],issues:[]};db.shifts.push(s);selectedShift=s.id;safeSet();render()}function closeShift(){let s=current();if(!s)return;if(s.issues.some(i=>!i.end)){alert('فيه مشكلة مفتوحة، اقفل عداد المشكلة الأول');return}if(confirm('تأكيد إغلاق الوردية؟ تقدر تفتحها للتعديل في أي وقت.')){s.closed=stamp();safeSet();render()}}function reopen(){editShift();render()}
function production(){let s=current();if(!s)return needShift();let locked=!!s.closed;return `${shiftIntro(s)}${locked?'<div class="notice">الوردية مغلقة. افتحها للتعديل من الرئيسية.</div>':`<div class="card"><h2 class="title">إضافة إنتاج</h2><form onsubmit="addProd(event)" class="stack"><div><label>خط الإنتاج</label><select id="prodLine" name="line" onchange="prodLineChanged()">${LINES.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div id="codeBox"><label>كود الرخام</label><input name="code" id="prodCode" placeholder="MDB 15"></div><div class="grid"><div><label id="qtyLabel">عدد الألواح</label><input name="count" type="number" min="0.01" step="any" required></div><div><label>طريقة العدد</label><select name="unit" id="prodUnit"><option value="boards">ألواح</option></select></div></div><div><label>طريقة الوزن</label><select name="mode"><option value="gross">شامل البلتة (خصم 40 كجم)</option><option value="net">صافي بدون فارغ</option></select></div><div><label>الوزن المسجل بالكجم</label><input name="weight" type="number" min="0.01" step="any" required></div><button class="btn good full">+ حفظ إنتاج وإضافة التالي</button></form></div>`}<div class="card"><h2 class="title">الإنتاج المسجل</h2>${s.prod.length?s.prod.slice().reverse().map(r=>`<div class="row"><div class="flex"><b>${esc(line(r.line)?.name)} ${r.code?'· '+esc(r.code):''}</b><span class="muted">${dateText(r.created)}</span></div><div class="flex"><span>${fmt(qty(r))} لوح · ${fmt(net(r,40))} كجم · ${qty(r)>0?fmt(net(r,40)/qty(r)):'—'} كجم/لوح</span>${!locked?`<button class="btn small secondary" onclick="editRecord('prod','${r.id}')">تعديل</button>`:''}</div></div>`).join(''):'<p class="muted">لسه مفيش إنتاج مسجل.</p>'}</div>`}function prodLineChanged(){let l=line(document.getElementById('prodLine').value);document.getElementById('codeBox').classList.toggle('hidden',l.kind!=='marble');document.getElementById('prodCode').placeholder=l.prefix==='MD'?'MD 232':'MDB 15';document.getElementById('prodUnit').innerHTML=l.kind==='wood'?'<option value="columns">أعمدة (حساب الألواح تلقائيًا)</option><option value="boards">ألواح مباشرة</option>':'<option value="boards">ألواح</option>'}function addProd(e){e.preventDefault();let s=current(),f=new FormData(e.target),l=line(f.get('line'));let r={id:uid(),line:l.id,code:l.kind==='marble'?String(f.get('code')).trim().toUpperCase():'',count:n(f.get('count')),unit:f.get('unit'),mode:f.get('mode'),weight:n(f.get('weight')),created:stamp()};if(l.kind==='marble'&&!r.code){alert('اكتب كود الرخام');return}if(r.count<=0||net(r,40)<=0){alert('راجع العدد والوزن؛ الصافي لازم يكون أكبر من صفر');return}s.prod.push(r);safeSet();render();document.getElementById('prodLine').value=l.id;prodLineChanged()}
function waste(){let s=current();if(!s)return needShift();let locked=!!s.closed;return `${shiftIntro(s)}${locked?'<div class="notice">افتح الوردية للتعديل من الرئيسية.</div>':`<div class="card"><h2 class="title">إضافة بلتة هالك</h2><p class="muted">هالك الخشب على بلتة مشتركة لكل الخطوط. سجل كل وزن عند التفريغ أو الوزن؛ بدون تكرار.</p><form class="stack" onsubmit="addWaste(event)"><div><label>مجموعة الهالك</label><select name="group">${WASTE.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></div><div><label>طريقة الوزن</label><select name="mode"><option value="gross">شامل البلتة (خصم 20 كجم)</option><option value="net">صافي بدون فارغ</option></select></div><div><label>وزن البلتة بالكجم</label><input name="weight" type="number" step="any" min="0.01" required></div><button class="btn good full">+ حفظ بلتة الهالك</button></form></div>`}<div class="card"><h2 class="title">إجماليات الهالك</h2>${WASTE.map(w=>`<div class="row flex"><b>${w.name}</b><b>${fmt(sumWaste(s,w.id))} كجم</b></div>`).join('')}<div class="row flex"><b>الإجمالي</b><b>${fmt(sumWaste(s))} كجم</b></div></div><div class="card"><h2 class="title">بلتات الهالك المسجلة</h2>${s.waste.length?s.waste.slice().reverse().map(r=>`<div class="row flex"><div><b>${WASTE.find(w=>w.id===r.group)?.name}</b><div class="muted">${fmt(net(r,20))} كجم صافي · ${dateText(r.created)}</div></div>${!locked?`<button class="btn small secondary" onclick="editRecord('waste','${r.id}')">تعديل</button>`:''}</div>`).join(''):'<p class="muted">لا توجد بلتات مسجلة.</p>'}</div>`}function addWaste(e){e.preventDefault();let s=current(),f=new FormData(e.target),r={id:uid(),group:f.get('group'),mode:f.get('mode'),weight:n(f.get('weight')),created:stamp()};if(net(r,20)<=0){alert('صافي الهالك لازم يكون أكبر من صفر');return}s.waste.push(r);safeSet();render()}
function issues(){let s=current();if(!s)return needShift();let locked=!!s.closed;return `${shiftIntro(s)}${!locked?`<div class="card"><h2 class="title">بدء مشكلة في خط</h2><div class="stack"><select id="issueLine">${LINES.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select><input id="issueReason" placeholder="سبب المشكلة (اختياري)"><button class="btn danger full" onclick="startIssue()">▶ بدء عداد المشكلة</button></div></div>`:''}<div class="card"><h2 class="title">مشاكل الوردية</h2>${s.issues.length?s.issues.slice().reverse().map(i=>`<div class="entry"><div class="flex"><b>${esc(line(i.line)?.name)}</b><span class="chip">${i.end?'انتهت':'جارية'}</span></div><div class="muted">${esc(i.reason||'بدون وصف')} · ${dateText(i.start)}</div><p><b>المدة: ${fmt(((new Date(i.end||Date.now())-new Date(i.start))/60000))} دقيقة</b></p>${!i.end&&!locked?`<button class="btn good small" onclick="stopIssue('${i.id}')">✓ تم الإصلاح</button>`:''} ${!locked?`<button class="btn secondary small" onclick="editIssue('${i.id}')">تعديل / حذف</button>`:''}</div>`).join(''):'<p class="muted">لا توجد مشاكل مسجلة.</p>'}</div><p class="muted">مدة المشكلة للتوثيق فقط؛ لا تُحسب كوزن هالك أو توقف مؤكد.</p>`}function startIssue(){let s=current(),l=document.getElementById('issueLine').value;if(s.issues.some(i=>i.line===l&&!i.end)){alert('فيه عداد مفتوح للخط ده بالفعل');return}s.issues.push({id:uid(),line:l,reason:document.getElementById('issueReason').value.trim(),start:stamp(),end:null});safeSet();render()}function stopIssue(id){let i=current().issues.find(x=>x.id===id);if(i){i.end=stamp();safeSet();render()}}function editIssue(id){let s=current(),i=s.issues.find(x=>x.id===id);if(!i)return;let v=prompt('عدل وصف المشكلة (أو سيبه زي ما هو)',i.reason);if(v===null)return;i.reason=v;if(confirm('تحب تحذف سجل المشكلة بالكامل؟ اضغط موافق للحذف أو إلغاء للاحتفاظ بالتعديل.'))s.issues=s.issues.filter(x=>x.id!==id);safeSet();render()}
function reports(){let s=current();return `<div class="card"><h2 class="title">سجل الورديات</h2><div><label>اختار الوردية</label><select onchange="selectedShift=this.value;render()">${db.shifts.slice().reverse().map(x=>`<option value="${x.id}" ${s?.id===x.id?'selected':''}>${esc(x.date)} · ${esc(x.label)} · ${x.closed?'مغلقة':'مفتوحة'}</option>`).join('')}</select></div></div>${!s?'<div class="card">لا توجد ورديات بعد.</div>':`${shiftIntro(s)}<div class="card"><h2 class="title">إنتاج كل خط</h2>${LINES.map(l=>`<div class="row"><div class="flex"><b>${l.name}</b><span>${fmt(sumQty(s,l.id))} لوح</span></div><div class="muted">${fmt(sumProd(s,l.id))} كجم صافي · متوسط ${sumQty(s,l.id)>0?fmt(sumProd(s,l.id)/sumQty(s,l.id)):'—'} كجم/لوح</div></div>`).join('')}</div><div class="card"><h2 class="title">إنتاج الأكواد والأنواع</h2>${codeReport(s)}<div class="row"><b>خشب 16: </b>${fmt(sumQty(s,'w2')+sumQty(s,'w4'))} لوح</div><div class="row"><b>خشب 20: </b>${fmt(sumQty(s,'w5')+sumQty(s,'w6'))} لوح</div></div><div class="card"><h2 class="title">الهالك والنسب</h2>${WASTE.map(w=>{let p=w.id==='wood'?LINES.filter(l=>l.kind==='wood').reduce((a,l)=>a+sumProd(s,l.id),0):sumProd(s,w.id);let h=sumWaste(s,w.id);return `<div class="row flex"><span>${w.name}</span><b>${fmt(h)} كجم · ${p+h>0?fmt(h/(p+h)*100):'—'}%</b></div>`}).join('')}<p class="muted">نسبة الهالك = صافي الهالك ÷ (صافي الإنتاج + صافي الهالك) × 100.</p></div><div class="card"><h2 class="title">تقرير المشاكل</h2>${LINES.map(l=>{let a=s.issues.filter(i=>i.line===l.id);let minutes=a.reduce((t,i)=>t+(new Date(i.end||Date.now())-new Date(i.start))/60000,0);return a.length?`<div class="row flex"><span>${l.name} (${a.length})</span><b>${fmt(minutes)} دقيقة</b></div>`:''}).join('')||'<p class="muted">لا توجد مشاكل.</p>'}</div><div class="card"><button class="btn full secondary" onclick="exportData()">تصدير نسخة احتياطية JSON</button></div>`}`}
function codeReport(s){let m=new Map();s.prod.filter(r=>line(r.line)?.kind==='marble').forEach(r=>{let k=r.line+'|'+r.code,old=m.get(k)||{count:0,weight:0};old.count+=qty(r);old.weight+=net(r,40);m.set(k,old)});return [...m].map(([k,v])=>`<div class="row flex"><div><b>${esc(k.split('|')[1])}</b><div class="muted">${line(k.split('|')[0]).name}</div></div><div style="text-align:left">${fmt(v.count)} لوح<div class="muted">${fmt(v.weight)} كجم · ${v.count?fmt(v.weight/v.count):'—'} كجم/لوح</div></div></div>`).join('')||'<p class="muted">لا توجد أكواد رخام مسجلة.</p>'}
function editRecord(type,id){let s=current(),arr=s[type],r=arr.find(x=>x.id===id);if(!r||s.closed)return;let c=prompt('تعديل الوزن المسجل بالكجم',r.weight);if(c===null)return;if(!Number.isFinite(Number(c))||Number(c)<=0){alert('وزن غير صحيح');return}let newWeight=Number(c),tare=type==='prod'?40:20;if(newWeight-(r.mode==='gross'?tare:0)<=0){alert('الصافي لازم يكون أكبر من صفر');return}r.weight=newWeight;if(type==='prod'){let v=prompt('تعديل العدد',r.count);if(v!==null&&n(v)>0)r.count=n(v);if(line(r.line)?.kind==='marble'){let code=prompt('تعديل الكود',r.code);if(code!==null&&code.trim())r.code=code.trim().toUpperCase()}}if(confirm('هل تريد حذف هذا التسجيل؟ موافق للحذف، إلغاء للاحتفاظ بالتعديلات.'))s[type]=arr.filter(x=>x.id!==id);safeSet();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='masnayi-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function needShift(){return '<div class="card"><p>افتح وردية أولًا من الصفحة الرئيسية.</p><button class="btn" onclick="go(\'home\')">الرئيسية</button></div>'}function render(){nav();document.getElementById('app').innerHTML=({home,production,waste,issues,reports}[page]||home)();if(page==='production'&&current()&&!current().closed)prodLineChanged()}render();setInterval(()=>{if(page==='issues'&&current()?.issues.some(i=>!i.end))render()},15000);
</script></body></html>
